server:
  port: 8085

spring:
  application:
    name: payment-service

  # ========== DATABASE ==========
  datasource:
    url: jdbc:sqlserver://localhost;instanceName=SQL2025;databaseName=mini_ecommerce_payment;encrypt=true;trustServerCertificate=true
    username: sa
    password: '123456'
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # ========== JPA ==========
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

  # ========== RABBITMQ DEFAULT ==========
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # ========== CONSUL ==========
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: ${spring.application.name}
        register-health-check: true
        prefer-ip-address: true

  # ========== i18n ==========
  messages:
    basename: messages,lib-messages
    encoding: UTF-8

# ========== ACTUATOR ==========
management:
  endpoints:
    web:
      exposure:
        include: health

# ========== LOGGING ==========
logging:
  level:
    root: INFO
    com.example.payment_service: DEBUG
  file:
    name: logs/payment-service.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ========== SWAGGER ==========
springdoc:
  api-docs:
    path: /api/payments/v3/api-docs

# ========== PAYOS CONFIGURATION ==========
payos:
  client-id: "9d250745-d0cc-407b-8128-d223f4e452b0"
  api-key: "959a6d85-6c8d-4302-8e0b-66fc7947bb0d"
  checksum-key: "e7f406a4e54d2f7af3234d843dccc6a7bbcb721f1416348fdc8f9cd085b7f9b5"
  return-url: http://localhost:3000/checkout?status=PAID
  cancel-url: http://localhost:3000/checkout?status=CANCELLED

# ========== OPENAPI & SECURITY ==========
openapi:
  title: Payment Service
  description: Payment Service API Documentation
  local-server-url: http://localhost:8085

security:
  public-endpoints: /api/payments/test-kafka,/api/payments/payos-webhook,/api/payments/payos-callback,/api/payments/payos-cancel,/api/payments/v3/api-docs/**

# ========== CALL ORDER SERVICE ==========
config:
  order:
    url: http://localhost:8083

# ========== CUSTOM RABBITMQ QUEUE/EXCHANGE ==========
rabbitmq:
  queue:
    order-created: order.created.payment
    payment-processed: payment.processed
  exchange:
    order: order.exchange
    payment: payment.exchange
  routing-key:
    order-created: order.created
    payment-processed: payment.processed

data:
  redis:
    host: localhost
    port: 6379

# ========== KAFKA ==========
kafka:
  bootstrap-servers: localhost:9092