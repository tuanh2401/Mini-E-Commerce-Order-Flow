services:
  # =======================================================
  # 1. HẠ TẦNG (Consul, Kafka, Zookeeper, Kafdrop, MinIO)
  # =======================================================
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    restart: always
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    restart: always
    ports:
      - "9002:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
    depends_on:
      - kafka

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # =======================================================
  # 2. API GATEWAY
  # =======================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "8082:8082"
    environment:
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS=false
      - SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME=api-gateway
      - SPRING_CLOUD_CONSUL_DISCOVERY_IP_ADDRESS=
      - MANAGEMENT_HEALTH_REDIS_ENABLED=false
      - MANAGEMENT_HEALTH_RABBIT_ENABLED=false
      - SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - consul

  # =======================================================
  # 3. AUTH SERVICE
  # =======================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS=false
      - SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME=auth-service
      - SPRING_CLOUD_CONSUL_DISCOVERY_IP_ADDRESS=
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://host.docker.internal;instanceName=SQL2025;databaseName=auth_db;encrypt=true;trustServerCertificate=true
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MANAGEMENT_HEALTH_REDIS_ENABLED=false
      - MANAGEMENT_HEALTH_RABBIT_ENABLED=false
      - SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - consul
      - kafka

  # =======================================================
  # 4. USER SERVICE
  # =======================================================
  user-service:
